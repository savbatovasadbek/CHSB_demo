<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <title>4-CSHB DEMO</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="studentInfo"></div>
    <div class="container">
      <div class="timer" id="timer">01:00:00</div>

      <div class="main">
        <div class="question-area">
          <h4 id="questionText"></h4>
          <br />
          <h3 id="englishAnswers"></h3>
          <hr />
          <img id="questionImage" class="question-img" />

          <div class="answers">
            <label class="option">
              <input type="radio" name="answer" value="0" />
              <span></span>
              A
            </label>

            <label class="option">
              <input type="radio" name="answer" value="1" />
              <span></span>
              B
            </label>

            <label class="option">
              <input type="radio" name="answer" value="2" />
              <span></span>
              C
            </label>

            <label class="option">
              <input type="radio" name="answer" value="3" />
              <span></span>
              D
            </label>
          </div>
        </div>

        <div class="sidebar">
          <div class="question-grid" id="questionGrid"></div>

          <button class="finish-btn" onclick="finishTest()">
            Testni yakunlash
          </button>
        </div>
      </div>
    </div>

      <div class="modal-content">
        <h2>Test Natijasi</h2>

        <div class="charts">
          <div class="chartBox">

            <p id="mathResult"></p>

    <div id="resultModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>🎉 Test Yakunlandi</h2>
          <p class="subtitle">Sizning umumiy natijangiz bilan tanishing</p>
        </div>

        <div class="student-profile-card">
          <div class="profile-info">
            <p>
              <strong>O'quvchi:</strong>
              <span id="resStudentName">Eshmatov Toshmat</span>
            </p>
            <p>
              <strong>Sinf / ID:</strong>
              <span id="resStudentClass">5-A sinf</span>
            </p>
          </div>
          <div class="status-badge passed" id="resStatus">O'tdi</div>
        </div>

        <div class="overall-stats">
          <div class="stat-item">
            <span class="stat-label">Umumiy Ball:</span>
            <span class="stat-value" id="totalScore">38 / 50</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Foiz ko'rsatkichi:</span>
            <span class="stat-value" id="totalPercentage">76%</span>
          </div>
        </div>

        <div class="charts">
          <div class="chartBox">
            <h3>Matematika</h3>
            <canvas id="mathChart"></canvas>
            <p id="mathResult" class="chart-result-text"></p>
          </div>

          <div class="chartBox">
            <h3>Ingliz tili</h3>
            <canvas id="engChart"></canvas>
            <p id="engResult" class="chart-result-text"></p>
          </div>
        </div>

        <div class="modal-buttons">
          <button onclick="restartTest()" class="restart-btn">
            🔄 Qayta boshlash
          </button>
          <button onclick="exitTest()" class="exit-btn">
            🚪 Testdan chiqish
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </body>
</html>
