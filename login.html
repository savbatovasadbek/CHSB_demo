<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <title>Testga kirish</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6f9;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-box {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      select {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        background: #2563eb;
        color: white;
        font-size: 18px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #1d4ed8;
      }

      .error {
        color: red;
        text-align: center;
        margin-top: 15px;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <h1>Testga kirish</h1>

      <div class="form-group">
        <label>Sinf</label>

        <select id="classSelect">
          <option value="">Sinfni tanlang</option>
          <option>5-A</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ism Familiya</label>

        <select id="nameSelect">
          <option value="">O'quvchini tanlang</option>
          <option value="st171063">ABDUKARIMOV SHUXRAT OTABEK O'G'LI</option>
          <option value="st151001">GAFUROV SARDOR TO'YLI O'G'LI</option>
          <option value="st151659">G'ANIYEVA CHAROS AKMALOVNA</option>
          <option value="st150036">HAYDAROV BUNYOD BEHZODOVICH</option>
          <option value="st154208">ERGASHEV RUSLAN OTABEKOVICH</option>
          <option value="st155026">DULANOVA DILNURA JAXONGIR QIZI</option>
          <option value="st156744">BOZOROV BEHRUZ SHAVKAT O'G'LI</option>
          <option value="st157742">BO'RIYEVA SUMBULA XUSRAVOVNA</option>
          <option value="st158497">BEG'AMOV JAVLONBEK JAMSHIDOVICH</option>
          <option value="st159435">BAXTIYAROV SHAHRIYOR SHOKIROVICH</option>
          <option value="st147269">ISMOILOV ABBOS SANJAROVICH</option>
          <option value="st145353">JO'RAYEVA DINARA ILYOS QIZI</option>
          <option value="st139957">MAMATMURODOV FAZLIDDIN IKROMOVICH</option>
          <option value="st132222">NORBOYEV JONIBEK ESHBADAL O'G'LI</option>
          <option value="st132023">NORMATOV KRISHTIAN KENJAYEVICH</option>
          <option value="st130284">O'RALOV ASADBEK AVAZOVICH</option>
          <option value="st106244">XASANOV AKBARBEK XASANOVICH</option>
          <option value="st104372">XOLTO'RAYEVA SHODIYONA IKROMJONOVNA</option>
          <option value="st103472">XURSANDOV ATXAMBEK XASAN O'G'LI</option>
          <option value="st103196">XUSHBAKOV FOZILBEK SHUXRATOVICH</option>
          <option value="st119692">SAIDOV FIRDAVS BEKMURODOVICH</option>
          <option value="st115408">SHUKURULLAYEVA GULHIDA ADHAM QIZI</option>
          <option value="st111957">TOJIBOYEVA SADOQAT ELMUROT QIZI</option>
        </select>
      </div>

      <div class="form-group">
        <label>ID</label>

        <select id="idSelect">
          <option value="">Loginni tanlang</option>
          <option value="st171063">st171063</option>
          <option value="st151001">st151001</option>
          <option value="st151659">st151659</option>
          <option value="st150036">st150036</option>
          <option value="st154208">st154208</option>
          <option value="st155026">st155026</option>
          <option value="st156744">st156744</option>
          <option value="st157742">st157742</option>
          <option value="st158497">st158497</option>
          <option value="st159435">st159435</option>
          <option value="st147269">st147269</option>
          <option value="st145353">st145353</option>
          <option value="st139957">st139957</option>
          <option value="st132222">st132222</option>
          <option value="st132023">st132023</option>
          <option value="st130284">st130284</option>
          <option value="st106244">st106244</option>
          <option value="st104372">st104372</option>
          <option value="st103472">st103472</option>
          <option value="st103196">st103196</option>
          <option value="st119692">st119692</option>
          <option value="st115408">st115408</option>
          <option value="st111957">st111957</option>
        </select>
      </div>

      <button onclick="startTest()">Start</button>

      <div class="error" id="error"></div>
    </div>

    <script>
      function startTest() {
        const classValue = document.getElementById("classSelect").value;
        const nameValue = document.getElementById("nameSelect").value;
        const idValue = document.getElementById("idSelect").value;

        const error = document.getElementById("error");

        if (!classValue || !nameValue || !idValue) {
          error.innerText = "Barcha ma'lumotlarni tanlang!";
          return;
        }

        // localStorage ga saqlash
        localStorage.setItem("studentClass", classValue);
        localStorage.setItem("studentName", nameValue);
        localStorage.setItem("studentId", idValue);

        // Test sahifasiga o'tish
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
